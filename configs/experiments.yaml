# Descra Step 7 Baseline Experimentation Configuration
# Evaluates pretrained google/flan-t5-small across decoding strategies and product types

experiment:
  experiment_id: "EXP-BASELINE-FLANT5-001"
  model_name: "google/flan-t5-small"
  model_revision: "main"
  device: "auto"
  use_fp16: true
  max_input_length: 512
  random_seed: 42
  sample_size: 100
  dataset_path: "data/processed/validation.jsonl"
  output_dir: "data/experiments"
  reports_dir: "reports/experiments"
  compute_bertscore: false

decoding_strategies:
  # Strategy 1: Greedy Decoding
  greedy:
    num_beams: 1
    do_sample: false
    max_new_tokens: 128
    description: "Deterministic greedy search selecting the single highest-probability token at each step."

  # Strategy 2: Fast Beam Search (2 Beams)
  beam_search_2:
    num_beams: 2
    do_sample: false
    early_stopping: true
    length_penalty: 1.0
    no_repeat_ngram_size: 3
    max_new_tokens: 128
    description: "Lightweight beam search tracking 2 active hypotheses with tri-gram repetition blocking."

  # Strategy 3: Standard Beam Search (4 Beams - Step 6 Historical Reference)
  beam_search_4:
    num_beams: 4
    do_sample: false
    early_stopping: true
    length_penalty: 1.0
    no_repeat_ngram_size: 3
    max_new_tokens: 128
    description: "Standard beam search tracking 4 active hypotheses (canonical Step 6 baseline comparison)."

  # Strategy 4: Conservative Nucleus Sampling
  sampling_conservative:
    num_beams: 1
    do_sample: true
    temperature: 0.7
    top_p: 0.90
    top_k: 50
    max_new_tokens: 128
    description: "Stochastic nucleus sampling with temperature 0.7, top-p 0.90, and top-k 50 for balanced novelty."

  # Strategy 5: Diverse Creative Sampling
  sampling_creative:
    num_beams: 1
    do_sample: true
    temperature: 1.0
    top_p: 0.95
    top_k: 40
    max_new_tokens: 128
    description: "Higher temperature stochastic sampling (temp 1.0, top-p 0.95, top-k 40) testing vocabulary diversity."

benchmarking:
  num_warmup_iterations: 3
  record_cuda_memory: true
  measure_per_token_latency: true

categories:
  proposed_roadmap_categories:
    - "Beauty and Personal Care"
    - "Electronics"
    - "Clothing"
    - "Home and Kitchen"
    - "Sports and Outdoors"
    - "Toys and Games"
    - "Health and Household"
    - "Automotive"
    - "Office Products"
    - "Pet Supplies"
  active_dataset_category: "All_Beauty"
