[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "descra"
version = "0.1.0"
description = "AI-powered Product Description Generator using Seq2Seq Transformers"
authors = [
    {name = "Rudraksh Sachdeva", email = "rudraksh@descra.ai"},
    {name = "Shivansee", email = "shivansee@descra.ai"},
    {name = "K Jahnvi", email = "jahnvi@descra.ai"},
    {name = "Kriti Abrol", email = "kriti@descra.ai"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "datasets>=2.17.0",
    "accelerate>=0.27.0",
    "sentencepiece>=0.2.0",
    "sacrebleu>=2.4.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0.1",
    "psutil>=5.9.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
pythonpath = ["src", "."]
testpaths = ["tests", "backend/tests"]

